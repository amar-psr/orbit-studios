<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Orbit Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orbit: {
                            bg: '#0B0D12', card: '#121620', border: '#1F2636',
                            accentGlow: '#818CF8', muted: '#9CA3AF'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080A0F;
            color: #F3F4F6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #bg-canvas {
            position: fixed;
            inset: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 6rem 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #rocket-canvas {
            width: min(260px, 52vw);
            height: min(260px, 52vw);
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 50px rgba(129,140,248,0.3));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1.1rem;
            border-radius: 999px;
            background: rgba(129,140,248,0.1);
            border: 1px solid rgba(129,140,248,0.3);
            color: #818CF8;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1.5rem;
        }
        .badge-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #818CF8;
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        .headline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 800;
            line-height: 1.08;
            color: #F3F4F6;
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }
        .headline span {
            background: linear-gradient(135deg, #818CF8, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtext {
            color: #9CA3AF;
            font-size: clamp(0.9rem, 1.6vw, 1rem);
            max-width: 440px;
            line-height: 1.75;
            margin-bottom: 2.5rem;
        }

        /* Email form */
        .notify-form {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            margin-bottom: 2rem;
        }
        .notify-form input {
            flex: 1;
            min-width: 0;
            padding: 0.8rem 1.2rem;
            border-radius: 999px;
            background: rgba(18,22,32,0.9);
            border: 1px solid #1F2636;
            color: #F3F4F6;
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .notify-form input:focus { border-color: rgba(129,140,248,0.5); }
        .notify-form input::placeholder { color: #4B5563; }
        .notify-form button {
            padding: 0.8rem 1.6rem;
            border-radius: 999px;
            background: #818CF8;
            color: #fff;
            font-weight: 700;
            font-size: 0.875rem;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }
        .notify-form button:hover {
            background: rgba(129,140,248,0.85);
            transform: scale(1.03);
        }

        .back-link {
            color: #4B5563;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #9CA3AF; }

        .nav-logo {
            position: fixed; top: 1.5rem; left: 1.75rem; z-index: 10;
            display: flex; align-items: center; gap: 0.6rem; text-decoration: none;
        }
        .nav-logo-icon {
            width: 2.2rem; height: 2.2rem; border-radius: 0.6rem;
            background: #818CF8; display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #fff; font-size: 1rem;
        }
        .nav-logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 1.05rem; color: #fff;
        }
        .nav-logo-text span { color: #818CF8; }

        /* Progress bar */
        .progress-wrap {
            width: min(320px, 80vw);
            margin-bottom: 2rem;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #4B5563;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .progress-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #818CF8, #06B6D4);
            animation: fill-bar 2.4s cubic-bezier(0.4,0,0.2,1) 0.6s forwards;
        }
        @keyframes fill-bar {
            to { width: 42%; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">O</div>
        <span class="nav-logo-text">Orbit<span>.</span>Studios</span>
    </a>

    <canvas id="bg-canvas"></canvas>

    <div class="content">

        <!-- Rocket illustration -->
        <canvas id="rocket-canvas" width="520" height="520"></canvas>

        <div class="badge">
            <span class="badge-dot"></span>
            In Development
        </div>

        <h1 class="headline">Stay Tuned.<br><span>We're Building It.</span></h1>

        <p class="subtext">
            This section is currently under construction. Our team is working hard to bring you something great. Drop your email below and we'll let you know the moment it launches.
        </p>

        <!-- Progress -->
        <div class="progress-wrap">
            <div class="progress-label">
                <span>Progress</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Notify form -->
        <form class="notify-form" id="notify-form" onsubmit="handleSubmit(event)">
            <input type="hidden" name="access_key" value="929767f1-c8fa-468d-ab2a-6a8d9e80c082">
            <input type="hidden" name="subject" value="New launch notification request — Orbit Studios">
            <input type="email" id="email-input" name="email" placeholder="Enter your email" required />
            <button type="submit" id="notify-btn">Notify Me</button>
        </form>
        <p id="notify-msg" style="font-size:0.8rem;margin-top:0.6rem;min-height:1.2rem;"></p>

        <a href="index.html" class="back-link">← Back to Home</a>

    </div>

    <script>
    // ── Starfield ───────────────────────────────────────────────────────────
    (function(){
        const canvas = document.getElementById('bg-canvas');
        const ctx    = canvas.getContext('2d');
        let W, H, stars = [], shooters = [];

        function init(){
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            stars = Array.from({length: 200}, () => ({
                x: Math.random() * W, y: Math.random() * H,
                r: Math.random() * 1.3 + 0.2,
                a: Math.random() * 0.8 + 0.1,
                speed: Math.random() * 0.002 + 0.001,
                phase: Math.random() * Math.PI * 2
            }));
        }

        function spawnShooter(){
            shooters.push({
                x: Math.random() * W * 0.6,
                y: Math.random() * H * 0.3,
                vx: 5 + Math.random() * 4,
                vy: 2 + Math.random() * 3,
                life: 1, decay: 0.022
            });
        }

        setInterval(spawnShooter, 3200);

        function draw(t){
            ctx.clearRect(0, 0, W, H);

            // Stars
            stars.forEach(s => {
                const a = s.a * (0.5 + 0.5 * Math.sin(t * s.speed * 1000 + s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${a})`;
                ctx.fill();
            });

            // Shooting stars
            shooters = shooters.filter(s => s.life > 0);
            shooters.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14);
                const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
                g.addColorStop(0,   `rgba(255,255,255,${s.life * 0.9})`);
                g.addColorStop(1,   'rgba(255,255,255,0)');
                ctx.strokeStyle = g;
                ctx.lineWidth   = 1.5;
                ctx.stroke();
                s.x    += s.vx;
                s.y    += s.vy;
                s.life -= s.decay;
            });

            requestAnimationFrame(draw);
        }

        init();
        window.addEventListener('resize', init);
        requestAnimationFrame(draw);
    })();

    // ── Rocket illustration ─────────────────────────────────────────────────
    (function(){
        const c   = document.getElementById('rocket-canvas');
        const ctx = c.getContext('2d');
        const W   = c.width, H = c.height;
        const cx  = W / 2,  cy = H / 2;

        function drawRocket(){
            ctx.clearRect(0, 0, W, H);

            // --- Flame / exhaust ---
            const flameGrad = ctx.createRadialGradient(cx, cy + 145, 5, cx, cy + 185, 55);
            flameGrad.addColorStop(0,   'rgba(255,220,80,0.95)');
            flameGrad.addColorStop(0.3, 'rgba(255,120,30,0.8)');
            flameGrad.addColorStop(0.7, 'rgba(180,50,200,0.4)');
            flameGrad.addColorStop(1,   'rgba(80,0,180,0)');

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx - 22, cy + 140);
            ctx.bezierCurveTo(cx - 40, cy + 180, cx - 18, cy + 230, cx, cy + 210);
            ctx.bezierCurveTo(cx + 18, cy + 230, cx + 40, cy + 180, cx + 22, cy + 140);
            ctx.closePath();
            ctx.fillStyle = flameGrad;
            ctx.fill();
            ctx.restore();

            // Inner flame
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy + 140);
            ctx.bezierCurveTo(cx - 14, cy + 170, cx - 6, cy + 195, cx, cy + 180);
            ctx.bezierCurveTo(cx + 6, cy + 195, cx + 14, cy + 170, cx + 10, cy + 140);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,240,160,0.9)';
            ctx.fill();
            ctx.restore();

            // --- Nozzle ---
            roundRect(ctx, cx - 28, cy + 118, 56, 28, 6, '#374151', 'rgba(255,255,255,0.1)', 1);

            // --- Body ---
            const bodyGrad = ctx.createLinearGradient(cx - 48, 0, cx + 48, 0);
            bodyGrad.addColorStop(0,   '#C7D0EE');
            bodyGrad.addColorStop(0.35, '#E8ECF8');
            bodyGrad.addColorStop(0.65, '#D0D8F0');
            bodyGrad.addColorStop(1,   '#9AA8CC');

            roundRect(ctx, cx - 48, cy - 120, 96, 242, 20, bodyGrad, 'rgba(200,210,240,0.2)', 1.5);

            // --- Accent stripe ---
            ctx.beginPath();
            ctx.rect(cx - 48, cy - 12, 96, 28);
            ctx.fillStyle = '#818CF8';
            ctx.fill();

            // Orbit "O" on stripe
            ctx.font      = 'bold 16px Space Grotesk, sans-serif';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText('ORBIT', cx, cy + 8);

            // --- Nose cone ---
            ctx.beginPath();
            ctx.moveTo(cx - 48, cy - 120);
            ctx.quadraticCurveTo(cx - 48, cy - 185, cx, cy - 215);
            ctx.quadraticCurveTo(cx + 48, cy - 185, cx + 48, cy - 120);
            ctx.closePath();
            const noseGrad = ctx.createLinearGradient(cx - 48, 0, cx + 48, 0);
            noseGrad.addColorStop(0,    '#818CF8');
            noseGrad.addColorStop(0.4,  '#A5B4FC');
            noseGrad.addColorStop(1,    '#4F46E5');
            ctx.fillStyle   = noseGrad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(165,180,252,0.3)';
            ctx.lineWidth   = 1.5;
            ctx.stroke();

            // --- Porthole window ---
            ctx.beginPath();
            ctx.arc(cx, cy - 60, 24, 0, Math.PI * 2);
            ctx.fillStyle   = '#0F172A';
            ctx.fill();
            ctx.strokeStyle = '#818CF8';
            ctx.lineWidth   = 3;
            ctx.stroke();

            // Window glass highlight
            const wg = ctx.createRadialGradient(cx - 8, cy - 70, 2, cx, cy - 60, 24);
            wg.addColorStop(0,   'rgba(129,140,248,0.5)');
            wg.addColorStop(0.5, 'rgba(6,182,212,0.25)');
            wg.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(cx, cy - 60, 24, 0, Math.PI * 2);
            ctx.fillStyle = wg;
            ctx.fill();

            // --- Left fin ---
            ctx.beginPath();
            ctx.moveTo(cx - 48, cy + 90);
            ctx.lineTo(cx - 100, cy + 140);
            ctx.lineTo(cx - 80, cy + 118);
            ctx.lineTo(cx - 48, cy + 50);
            ctx.closePath();
            ctx.fillStyle   = '#818CF8';
            ctx.fill();
            ctx.strokeStyle = 'rgba(165,180,252,0.3)';
            ctx.lineWidth   = 1;
            ctx.stroke();

            // --- Right fin ---
            ctx.beginPath();
            ctx.moveTo(cx + 48, cy + 90);
            ctx.lineTo(cx + 100, cy + 140);
            ctx.lineTo(cx + 80,  cy + 118);
            ctx.lineTo(cx + 48, cy + 50);
            ctx.closePath();
            ctx.fillStyle   = '#818CF8';
            ctx.fill();
            ctx.stroke();

            // --- Small stars around rocket ---
            [[cx + 115, cy - 80, 3], [cx - 110, cy - 30, 2.5], [cx + 100, cy + 20, 2],
             [cx - 95, cy - 130, 2], [cx + 80, cy - 150, 1.5]].forEach(([x, y, r]) => {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.fill();
            });

            // --- Small orbiting moon ---
            ctx.beginPath();
            ctx.arc(cx - 115, cy + 60, 20, 0, Math.PI * 2);
            const mg = ctx.createRadialGradient(cx - 122, cy + 53, 2, cx - 115, cy + 60, 20);
            mg.addColorStop(0,   '#D1D5DB');
            mg.addColorStop(0.6, '#9CA3AF');
            mg.addColorStop(1,   '#374151');
            ctx.fillStyle = mg;
            ctx.fill();

            // Moon craters
            [[cx - 110, cy + 55, 4], [cx - 122, cy + 66, 3]].forEach(([x, y, r]) => {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(55,65,81,0.55)';
                ctx.fill();
            });
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke, lw){
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if(fill)   { ctx.fillStyle = fill; ctx.fill(); }
            if(stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
        }

        drawRocket();
    })();

    // ── Progress bar counter ────────────────────────────────────────────────
    (function(){
        const bar = document.getElementById('progress-bar');
        const pct = document.getElementById('progress-pct');
        let current = 0;
        const target = 42;
        const interval = setInterval(() => {
            if(current >= target){ clearInterval(interval); return; }
            current++;
            pct.textContent = current + '%';
        }, 55);
    })();

    // ── Notify form ─────────────────────────────────────────────────────────
    async function handleSubmit(e){
        e.preventDefault();
        const btn = document.getElementById('notify-btn');
        const msg = document.getElementById('notify-msg');

        btn.textContent = 'Sending…';
        btn.disabled    = true;

        const data = new FormData(document.getElementById('notify-form'));
        const res  = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: data
        });
        const json = await res.json();

        if(json.success){
            btn.textContent      = "You're on the list ✓";
            btn.style.background = 'rgba(16,185,129,0.85)';
            msg.textContent      = "We'll email you the moment we launch.";
            msg.style.color      = '#6EE7B7';
            document.getElementById('email-input').value = '';

            // Reset after 5 seconds so they can re-submit if needed
            setTimeout(() => {
                btn.textContent      = 'Notify Me';
                btn.style.background = '';
                btn.disabled         = false;
                msg.textContent      = '';
            }, 5000);
        } else {
            btn.textContent  = 'Notify Me';
            btn.disabled     = false;
            msg.textContent  = 'Something went wrong. Please try again.';
            msg.style.color  = '#FCA5A5';
            setTimeout(() => { msg.textContent = ''; }, 4000);
        }
    }
    </script>

</body>
</html>
